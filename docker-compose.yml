services:
  crm:
    build: .
    container_name: terra-crm
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      CRM_PASSWORD: ${CRM_PASSWORD:?Set CRM_PASSWORD in .env}
      DATA_DIR: /data
    volumes:
      - crm-data:/data
    mem_limit: 512m
    cpus: 1.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  crm-data:
